<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fiona's Kitchen</title>
<!-- Load Firebase Storage SDK for images -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js';
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js';
  import { getFirestore, doc, setDoc, getDoc, deleteDoc, collection, getDocs, addDoc, onSnapshot, query, where, orderBy, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js';
  import { getStorage, ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-storage.js';

  const firebaseConfig = {
    apiKey: "AIzaSyBlrh8RMSF4QOuND-MWorEERPcig2LirbQ",
    authDomain: "fiona-a79a6.firebaseapp.com",
    projectId: "fiona-a79a6",
    storageBucket: "fiona-a79a6.firebasestorage.app",
    messagingSenderId: "656679972697",
    appId: "1:656679972697:web:7897a4a2bcd6a3f2466648",
    measurementId: "G-X0LWTN6PT5"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const storage = getStorage(app);

  let currentProfile = null;
  let currentUser = null;
  let todaysMeals = [];
  let todaysWater = 0;
  let savedRecipes = [];
  let unsubMeals = null;
  let unsubRecipes = null;
  let isChatting = false;

  const RING_CIRC = 2 * Math.PI * 42;

  // Helper to get current time string
  function getTimeString() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function todayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  window.showScreen = function(id) {
    ['loadingScreen','loginScreen','signupScreen','dashScreen'].forEach(s => {
      const el = document.getElementById(s);
      if (el) el.style.display = (s === id) ? 'block' : 'none';
    });
    window.scrollTo(0,0);
  };

  window.switchMainPage = function(page) {
    // Hide all pages inside the dashboard
    ['home', 'cookbook'].forEach(p => {
      document.getElementById('page-'+p).classList.add('hidden');
      document.getElementById('nav-'+p).classList.remove('active');
    });
    // Show selected
    document.getElementById('page-'+page).classList.remove('hidden');
    document.getElementById('nav-'+page).classList.add('active');
  };

  // EXPOSE TO GLOBAL for inline HTML clicks
  window.setStatus = function(id, msg, isError) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = msg;
    el.className = 'status ' + (isError ? 'error' : 'success');
  };

  // ---- CHAT LOGIC ----
  let chatHistory = [ { role: "assistant", content: "Hi Fiona 🌿 I'm here if you want to chat about meals, ask a quick question, or just need a little encouragement. What's on your mind?" } ];

  window.openChat = function() { document.getElementById('chatOverlay').classList.add('open'); setTimeout(() => document.getElementById('chatInput').focus(), 100); };
  window.closeChat = function() { document.getElementById('chatOverlay').classList.remove('open'); };

  window.sendChat = async function() {
    if (isChatting) return;
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    appendChatMsg(text, 'user', getTimeString());
    chatHistory.push({ role: 'user', content: text });
    isChatting = true;

    const loadingId = 'thinking-' + Date.now();
    appendChatMsg('...', 'ai', getTimeString(), loadingId);

    try {
      const p = currentProfile || { name: 'Fiona', age: '', goal: '', activityLevel: '', medicalConditions: [] };
      const t = p.targets || {};
      const calTotal = todaysMeals.reduce((s, m) => s + (m.calories || 0), 0);
      const remaining = (t.calorieTarget || 2000) - calTotal;
      const now = new Date().toLocaleString();

      const systemMsg = {
        role: 'system',
        content: `You are a warm, friendly dietitian for ${p.name}. The current time is ${now}. ` +
          `She is ${p.age} years old, goal: ${p.goal}, activity: ${p.activityLevel}. Medical: ${(p.medicalConditions||[]).join(', ')}. ` +
          `Today she has logged: ${calTotal} calories (target ~${t.calorieTarget||2000}), meaning she has ~${remaining} calories left today. ` +
          `Keep answers conversational, warm, and relatively short (2-4 sentences). Never mention being an AI.`
      };

      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: [systemMsg, ...chatHistory] })
      });

      const data = await res.json();
      document.getElementById(loadingId)?.remove();
      
      if (!res.ok) throw new Error(data.error || "API Error");
      
      const reply = data.choices?.[0]?.message?.content || "I didn't quite catch that.";
      appendChatMsg(reply, 'ai', getTimeString());
      chatHistory.push({ role: 'assistant', content: reply });
    } catch (e) {
      document.getElementById(loadingId)?.remove();
      appendChatMsg("⚠️ Error: " + e.message, 'ai', getTimeString());
    } finally {
      isChatting = false;
    }
  };

  function appendChatMsg(text, sender, time, id = '') {
    const container = document.getElementById('chatMessages');
    const wrapper = document.createElement('div');
    wrapper.className = `msg-wrapper ${sender}`;
    if (id) wrapper.id = id;
    
    wrapper.innerHTML = `
      <div class="msg-time">${time}</div>
      <div class="chat-msg ${sender}">${escapeHtml(text)}</div>
    `;
    container.appendChild(wrapper);
    container.scrollTop = container.scrollHeight;
  }

  // ---- IMAGE UPLOAD / MACRO SCANNING ----
  window.handlePhotoUpload = async function(event) {
    const file = event.target.files[0];
    if (!file || !currentUser) return;

    setStatus('photoStatus', 'Uploading image...');
    try {
      // 1. Upload to Firebase Storage
      const storageRef = ref(storage, `scans/${currentUser.uid}/${Date.now()}_${file.name}`);
      await uploadBytes(storageRef, file);
      const downloadURL = await getDownloadURL(storageRef);

      setStatus('photoStatus', 'Analyzing with AI...');
      
      // 2. Send to DeepSeek (We use a vision-capable model or tell AI to read text)
      // Note: Standard deepseek-chat doesn't natively "see" images. If you are using a vision model (like gpt-4o or deepseek-vl), change the model below.
      const p = currentProfile;
      const system = `You are an expert nutritionist. The user uploaded an image of food or a nutrition label. ` +
        `Analyze the image and respond ONLY with a JSON object: {"meal": "description", "calories": 000, "protein": 00, "carbs": 00, "fat": 00, "advice": "1 short sentence"}. ` +
        `Do not output any other text.`;

      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'deepseek-chat', // If you have a vision model, change this
          messages: [
            { role: 'system', content: system },
            { role: 'user', content: `Here is the image URL: ${downloadURL}. Please analyze it.` }
          ]
        })
      });

      const data = await res.json();
      const raw = data.choices?.[0]?.message?.content || '';
      
      let parsed;
      try {
        const match = raw.match(/\{[\s\S]*\}/);
        parsed = JSON.parse(match ? match[0] : raw);
      } catch (e) {
        throw new Error("Could not read the image data clearly.");
      }

      // 3. Save to meals
      await addDoc(collection(db, 'meals', currentUser.uid, 'items'), {
        description: parsed.meal || 'Scanned Meal',
        calories: parsed.calories || 0,
        protein: parsed.protein || 0,
        carbs: parsed.carbs || 0,
        fat: parsed.fat || 0,
        imageUrl: downloadURL,
        dateKey: todayKey(),
        createdAt: serverTimestamp()
      });

      setStatus('photoStatus', `✅ Logged! ${parsed.calories} cal. ${parsed.advice}`, false);
      setTimeout(() => setStatus('photoStatus', ''), 5000);

    } catch (e) {
      console.error(e);
      setStatus('photoStatus', '⚠️ Error: ' + e.message, true);
    }
  };

  // ---- INITIALIZATION (Auth, Data, Targets) ----
  window.addEventListener('error', function(e) {
    const el = document.getElementById('globalError');
    if (el) { el.style.display = 'block'; el.textContent = 'Error: ' + e.message; }
  });

  window.signInWithGoogle = async function() {
    try { await signInWithPopup(auth, new GoogleAuthProvider()); } 
    catch (e) { setStatus('status', 'Failed: ' + e.message, true); }
  };

  window.logout = async function() {
    closeSettings();
    await signOut(auth);
  };

  onAuthStateChanged(auth, async (user) => {
    if (!user) { showScreen('loginScreen'); return; }
    currentUser = user;
    showScreen('loadingScreen');
    try {
      const snap = await getDoc(doc(db, 'profiles', user.uid));
      if (snap.exists() && snap.data().setupComplete) {
        currentProfile = snap.data();
        await loadTodayData();
        renderDashboard();
      } else {
        document.getElementById('name').value = user.displayName || '';
        showWizard(1);
        showScreen('signupScreen');
      }
    } catch (e) {
      showScreen('loginScreen');
      setStatus('status', 'Could not load profile.', true);
    }
  });

  // ... [Keep all your existing profile saving, water logging, meal rendering, and wizard logic exactly as they were] ...
  // Note: To keep this response manageable, I'm assuming you still have the onAuthStateChanged, saveProfile, addWater, etc. functions from the previous working version.
</script>
<style>
  /* Add these new styles to your existing <style> block */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; background: white;
    display: flex; justify-content: space-around; padding: 10px 0 max(10px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); z-index: 50; box-shadow: 0 -4px 20px rgba(0,0,0,0.03);
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 12px; color: var(--ink-soft); cursor: pointer; font-weight: 600;

  .nav-item.active { color: var(--sage-dark); }
  .nav-icon { font-size: 20px; margin-bottom: 4px; }
  
  /* Adjust body padding so content doesn't hide behind bottom nav */
  body { padding-bottom: 90px; } 
  
  .msg-wrapper { display: flex; flex-direction: column; margin-bottom: 12px; }
  .msg-wrapper.user { align-items: flex-end; }
  .msg-wrapper.ai { align-items: flex-start; }

  .photo-btn {
    background: #f3ede1; color: var(--ink); border: 2px dashed var(--line);
    border-radius: 16px; padding: 24px; text-align: center; cursor: pointer; transition: all 0.2s;
  }
  .photo-btn:hover { background: #ebe2ce; border-color: var(--sage); }
</style>
</head>
<body>

<!-- Global error catcher -->
<div id="globalError" style="display:none; position:fixed; top:0; left:0; right:0; background:#e74c3c; color:white; padding:16px; z-index:9999; font-size:14px;"></div>

<!-- Your existing Header -->
<div class="app-header">
  <div class="brand"><span class="logo">🍃</span><span>Fiona's Kitchen</span></div>
  <div class="header-actions"><button class="icon-btn" onclick="openSettings()">⚙️</button></div>
</div>

<!-- Chat Room -->
<div class="chat-overlay" id="chatOverlay">
  <div class="chat-header">
    <h3>🍃 Dietitian</h3>
    <button class="chat-close" onclick="closeChat()">×</button>
  </div>
  <div class="chat-messages" id="chatMessages">
    <!-- Messages injected here -->
  </div>
  <div class="chat-input-area">
    <input type="text" id="chatInput" placeholder="Ask a question…" onkeypress="if(event.key==='Enter') sendChat()">
    <button onclick="sendChat()">↑</button>
  </div>
</div>

<!-- Dashboard App Area -->
<div class="wrap" id="dashScreen" style="display:none;">
  
  <!-- PAGE 1: HOME -->
  <div id="page-home">
    <div class="hello" id="greeting">Hi</div>
    <p class="hello-sub">Here's how today's going.</p>
    
    <!-- Rings (Water & Calories) -->
    <div class="rings-row" style="margin-bottom: 20px;">
      <div class="ring-card">
        <svg class="ring-svg" viewBox="0 0 100 100">
          <circle class="ring-track" cx="50" cy="50" r="42"></circle>
          <circle class="ring-fill water" id="waterRing" cx="50" cy="50" r="42" stroke-dasharray="263.9" stroke-dashoffset="263.9"></circle>
          <text x="50" y="55" text-anchor="middle" class="ring-text" id="waterRingText">0</text>
        </svg>
        <div class="ring-label"><strong id="waterCount">0</strong>of <span id="waterGoal">8</span> glasses</div>
        <div class="water-controls">
          <button class="btn-soft" onclick="removeWater()">−</button>
          <button onclick="addWater()">+</button>
        </div>
      </div>
      <div class="ring-card">
        <svg class="ring-svg" viewBox="0 0 100 100">
          <circle class="ring-track" cx="50" cy="50" r="42"></circle>
          <circle class="ring-fill cal" id="calRing" cx="50" cy="50" r="42" stroke-dasharray="263.9" stroke-dashoffset="263.9"></circle>
          <text x="50" y="55" text-anchor="middle" class="ring-text" id="calRingText">0</text>
        </svg>
        <div class="ring-label"><strong id="calCount">0</strong>of <span id="calGoal">—</span> cal</div>
      </div>
    </div>

    <!-- Photo Scanner -->
    <div class="card">
      <h3>Snap a meal or label</h3>
      <label for="fileCamera" class="photo-btn">
        <div style="font-size:32px; margin-bottom:8px;">📷</div>
        <div style="font-weight:600;">Tap to take a photo</div>
        <div style="font-size:13px; color:var(--ink-soft); margin-top:4px;">Our AI will figure out the macros</div>
        <input type="file" id="fileCamera" accept="image/*" capture="environment" onchange="handlePhotoUpload(event)" style="display:none;">
      </label>
      <div class="status" id="photoStatus"></div>
    </div>

    <!-- Today's Meals -->
    <div class="card">
      <h3>Today's meals</h3>
      <ul class="meal-list" id="mealList"></ul>
    </div>

    <!-- Ask Dietitian Button (Triggers Chat) -->
    <button class="btn-terra" onclick="openChat()" style="margin-bottom: 20px;">💬 Chat with your Dietitian</button>
  </div>

  <!-- PAGE 2: COOKBOOK -->
  <div id="page-cookbook" class="hidden">
    <div class="hello">Cookbook</div>
    <p class="hello-sub">Ideas based on what you have.</p>
    
    <div class="card">
      <h3>What can I make?</h3>
      <textarea id="cookPrompt" rows="2" placeholder="e.g. I have chicken, carrots and rice..."></textarea>
      <button class="btn-terra" onclick="cookNow()">🍳 Generate Recipe</button>
      <div class="status" id="cookStatus"></div>
    </div>

    <div class="card">
      <h3>Saved Recipes</h3>
      <div id="recipeList"><div class="empty">No recipes yet.</div></div>
    </div>
  </div>

</div>

<!-- BOTTOM NAVIGATION -->
<div class="bottom-nav" id="bottomNav" style="display:none;">
  <button class="nav-item active" id="nav-home" onclick="switchMainPage('home')">
    <span class="nav-icon">🏠</span> Home
  </button>
  <button class="nav-item" id="nav-cookbook" onclick="switchMainPage('cookbook')">
    <span class="nav-icon">📖</span> Cookbook
  </button>
  <button class="nav-item" onclick="openChat()">
    <span class="nav-icon">💬</span> Dietitian
  </button>
</div>

<!-- (Assume the rest of your modal/wizard HTML stays the same) -->

</body>
